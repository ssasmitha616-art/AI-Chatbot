<div id="apiKeyModal">
    <div class="auth-card">
        <div class="auth-header">
            <h2>🔑 AI Access Key Setup</h2>
            <p>පහත උපදෙස් අනුගමනය කර තත්පර 10කින් ඔබගේ නොමිලේ ලැබෙන AI Key එක ලබාගන්න.</p>
        </div>
        <div class="auth-form">
            <a href="https://aistudio.google.com/app/apikey" target="_blank" style="text-decoration: none;">
                <button type="button" class="auth-btn" style="background: #10b981; color: white; margin-bottom: 10px;">
                    1. 👉 Click Here to Get API Key (Google Studio)
                </button>
            </a>

            <div style="display: flex; gap: 8px;">
                <input type="text" id="aiApiKeyInput" class="auth-input" placeholder="Paste Key Here (AIzaSy...)">
                <button type="button" class="auth-btn" onclick="pasteFromClipboard()" style="margin:0; width: auto; background: #334155; color: #38bdf8; font-size: 13px;" title="Paste from Clipboard">
                    📋 Paste
                </button>
            </div>

            <button class="auth-btn" onclick="saveApiKey()">Save Access Key</button>
            <button class="auth-btn" style="background: #334155; color: white;" onclick="closeApiKeyModal()">Skip / Close</button>
        </div>
    </div>
</div>
